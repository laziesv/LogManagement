# Keep Nginx access logging local so page refreshes do not ingest new app logs.
# Query strings, headers, cookies and request bodies are deliberately omitted.
map $status $access_severity {
 default 3;
 ~^4 5;
 ~^5 8;
}
log_format logdesk_access escape=json
 '{"@timestamp":"$time_iso8601","source":"network",'
 '"vendor":"nginx","product":"web-server","event_type":"nginx_access",'
 '"severity":$access_severity,"src_ip":"$remote_addr","host":"$hostname",'
 '"http_method":"$request_method","url":"$uri","status_code":$status,'
 '"protocol":"$server_protocol","bytes_sent":$body_bytes_sent,'
 '"request_time":$request_time,"origin":"live","transport":"syslog_udp"}';

server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 access_log /var/log/nginx/access.log logdesk_access;
 client_max_body_size 2m;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location /api/ {
   access_log off;
   proxy_pass http://backend:3000;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_read_timeout 30s;
 }
 location = /ingest { access_log off; proxy_pass http://backend:3000; proxy_set_header Host $host; }
 location /assets/ { try_files $uri =404; }
 location / { try_files $uri $uri/ /index.html; }
}
