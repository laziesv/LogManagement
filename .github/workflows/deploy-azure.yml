name: Deploy to Azure VM

on:
  workflow_dispatch:

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy over SSH
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AZURE_SSH_KEY }}

      - name: Trust Azure host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.AZURE_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull and restart stack
        run: |
          ssh "${{ secrets.AZURE_USER }}@${{ secrets.AZURE_HOST }}" <<'EOF'
          set -eu
          cd "$HOME/LogManagement"
          git fetch origin main
          git reset --hard origin/main
          docker compose up -d --build
          docker compose ps
          EOF
