name: Deploy to Azure VM

on:
  push:
    branches: [deploy]
  workflow_dispatch:

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy over SSH
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.AZURE_SSH_KEY }}" > ~/.ssh/azure_vm
          chmod 600 ~/.ssh/azure_vm
          ssh-keyscan -H "${{ secrets.AZURE_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull and restart stack
        run: |
          ssh -i ~/.ssh/azure_vm "${{ secrets.AZURE_USER }}@${{ secrets.AZURE_HOST }}" <<'EOF'
          set -eu
          cd "$HOME/LogManagement"
          git fetch origin deploy
          git reset --hard origin/deploy
          docker compose up -d --build
          docker compose ps
          EOF
